# Уровень 2 (перенос из level2.txt): две змейки одновременно (parallel), затем красные.
description: "Enemy Recons"
spawnInterval: 1.0
events:
  - parallel:                              # обе группы спавнятся одновременно (аналог sync_cmd)
      - - { enemy: blue, count: 3, route: zmeyka1-left, after: formation }
      - - { enemy: blue, count: 3, route: zmeyka1-right, after: scatter }
  - { enemy: red, count: 2 }               # после завершения обеих волн
